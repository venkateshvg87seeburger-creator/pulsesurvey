<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-50 min-h-screen">

<div id="loginView" class="hidden min-h-screen flex flex-col items-center justify-center p-4 bg-gradient-to-br from-slate-100 to-slate-200">
  <!-- SEEBURGER Logo Concept inside admin login -->
  <div class="mb-6 text-center flex items-center justify-center gap-1">
    <span class="text-3xl font-extrabold tracking-wider text-[#d0101b] uppercase font-sans">SEEBURGER</span>
  </div>
  <div class="card w-full max-w-sm p-8 shadow-xl bg-white border border-slate-200 rounded-2xl">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-red-50 text-[#d0101b] mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
      </div>
      <h2 class="title text-gray-800 text-2xl">Admin Portal</h2>
      <p class="text-gray-500 text-xs mt-1">Authenticate to access the admin panel</p>
    </div>
    
    <input id="adminKey" type="password" class="input mb-4" placeholder="Enter Admin Access Key" onkeydown="if(event.key==='Enter') login()">
    <button onclick="login()" class="btn w-full bg-[#d0101b] hover:bg-[#b00c14]">Sign In</button>
    <p id="err" class="text-red-500 text-sm hidden mt-3 text-center">Invalid Access Key</p>
    
    <div class="mt-4 text-center">
      <a href="/" class="text-[#d0101b] hover:underline text-xs font-semibold">Back to Feedback Form</a>
    </div>
  </div>
</div>

<div id="admin" class="hidden w-full max-w-5xl mx-auto p-6">

<div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-200">
  <div>
    <h1 class="title text-3xl font-extrabold tracking-tight flex items-center gap-2">
      <span class="text-[#d0101b] font-sans">SEEBURGER</span>
      <span class="text-xs bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded uppercase tracking-widest">Pulse Admin</span>
    </h1>
    <p class="text-slate-500 text-sm mt-1">Review feedback and oversee anonymous comments</p>
  </div>
  <button onclick="logout()" class="btn bg-slate-800 hover:bg-slate-900 text-white gap-2 transition-all">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
    </svg>
    Logout
  </button>
</div>

<div id="feedTab" class="space-y-6">
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 pb-4 border-b border-slate-100">
      <div>
        <h2 class="text-xl font-bold text-slate-800">Submitted Feedback</h2>
        <p class="text-gray-500 text-xs mt-0.5">Anonymous feedback entries submitted by internal employees</p>
      </div>
      <button onclick="purgeFeedback()" class="btn bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-700 font-semibold text-xs py-2 px-4 transition-all rounded-xl focus:ring-4 focus:ring-rose-50 flex items-center gap-1.5 shadow-none">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
        </svg>
        Purge All Data
      </button>
    </div>
    
    <div id="list" class="space-y-4 min-h-[150px]"></div>
    
    <div class="flex items-center justify-between pt-6 border-t border-slate-100 mt-6">
      <button id="prevBtn" onclick="prev()" class="btn bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 py-2 px-4 rounded-xl disabled:opacity-50 disabled:pointer-events-none transition-all flex items-center gap-1 shadow-none">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        Previous
      </button>
      <span id="page" class="text-xs font-semibold uppercase tracking-wider text-slate-500 bg-slate-100 py-1.5 px-3 rounded-full">Page 1</span>
      <button id="nextBtn" onclick="next()" class="btn bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 py-2 px-4 rounded-xl disabled:opacity-50 disabled:pointer-events-none transition-all flex items-center gap-1 shadow-none">
        Next
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>
  </div>
</div>

</div>

<script src="js/admin.js"></script>
</body>
</html>
