<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-gray-100 p-6">

<div id="denied" class="hidden text-center mt-20">
<h1 class="text-2xl text-red-600">Access Denied</h1>
</div>

<div id="admin" class="hidden max-w-5xl mx-auto">

<div class="flex justify-between mb-4">
<h1 class="title">Admin</h1>
<button onclick="logout()" class="btn">Logout</button>
</div>

<div class="flex gap-2 mb-4">
<button onclick="showTab('emp')" class="btn">Employees</button>
<button onclick="showTab('feed')" class="btn">Feedback</button>
</div>

<div id="empTab" class="card">
<input id="empInput" class="input mb-2" placeholder="Employee ID">
<button onclick="addEmp()" class="btn mb-2">Add</button>
<input type="file" id="csv">
<button onclick="uploadCSV()" class="btn mt-2">Upload CSV</button>
<div id="empList" class="mt-3 max-h-64 overflow-y-auto"></div>
</div>

<div id="feedTab" class="card hidden">
<div id="list" class="space-y-3"></div>
<div class="flex justify-between mt-3">
<button onclick="prev()" class="btn">Prev</button>
<span id="page"></span>
<button onclick="next()" class="btn">Next</button>
</div>
</div>

</div>

<script src="js/admin.js"></script>
</body>
</html>
