<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body
  class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- SEEBURGER Logo Concept Header -->
  <div class="mb-8 text-center flex items-center justify-center gap-1">
    <span class="text-3xl font-extrabold tracking-wider text-[#d0101b] uppercase font-sans">SEEBURGER</span>
    <span class="text-xs bg-slate-200 text-slate-700 font-bold px-2 py-0.5 rounded uppercase tracking-widest ml-2">Pulse</span>
  </div>

  <div class="card w-full max-w-md p-8 relative shadow-xl rounded-2xl bg-white border border-slate-200">

    <div id="formView">
      <div class="flex flex-col mb-6">
        <h3 class="text-slate-900 font-extrabold text-2xl tracking-tight">Submit Feedback</h3>
        <p class="text-slate-500 text-xs mt-1">We value your honest opinion. Submissions are completely anonymous.</p>
      </div>
      <label class="block text-gray-500 text-xs font-semibold mb-1 uppercase tracking-wide">Department</label>
      <select id="department" class="input mb-4 text-gray-700">
        <option>Consulting</option>
        <option>Support</option>
        <option>Development</option>
        <option>HR & Finance</option>
      </select>

      <label class="block text-gray-500 text-xs font-semibold mb-1 uppercase tracking-wide">Category</label>
      <select id="category" class="input mb-4 text-gray-700">
        <option>Work Place Environment</option>
        <option>Career Growth</option>
        <option>Rewards & Recognition</option>
        <option>Company Policies</option>
        <option>Benefits</option>
        <option>Others</option>
      </select>

      <label class="block text-slate-500 text-xs font-semibold mb-1 uppercase tracking-wide">Your Feedback</label>
      <textarea id="message" class="input mb-5 min-h-[120px] resize-none"
        placeholder="Type your honest feedback here..."></textarea>
      <button id="submitBtn" onclick="submit()" class="btn w-full bg-[#d0101b] hover:bg-[#b00c14] hover:shadow-lg focus:ring-4 focus:ring-red-100 text-white font-bold transition-all h-12">Submit Feedback</button>
      <p id="msg" class="text-center mt-3 text-sm font-medium text-red-500"></p>
    </div>

    <div id="successView" class="hidden text-center py-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 mb-6">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h3 class="text-2xl font-bold text-slate-800 mb-2">Thank You!</h3>
      <p class="text-slate-500 mb-6 mx-auto max-w-xs text-sm">Your feedback has been submitted successfully and sent to the HR Team.</p>
      <div class="flex flex-col gap-2">
        <button onclick="resetForm()" class="btn w-full bg-[#d0101b] hover:bg-[#b00c14] text-white">Submit Another Feedback</button>
        <button onclick="closeWindow()" class="btn w-full bg-slate-800 hover:bg-slate-900 border-none text-white">Close Window</button>
      </div>
    </div>

  </div>

  <div class="mt-6 text-center">
    <a href="admin-view.html" class="text-slate-400 hover:text-slate-700 text-xs font-semibold transition-colors inline-flex items-center gap-1.5 hover:underline">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
      </svg>
      Admin Portal
    </a>
  </div>

  <script src="js/main.js"></script>
</body>

</html>
