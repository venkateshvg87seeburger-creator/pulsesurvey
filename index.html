<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body
  class="bg-gradient-to-br from-indigo-600 to-purple-600 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="card w-full max-w-md p-8 relative">

    <div id="loginView">
      <h2 class="title text-center mb-6 text-gray-800">Pulse</h2>
      <input id="empId" class="input mb-4" placeholder="Enter Employee ID">
      <button onclick="login()" class="btn w-full">Continue</button>
      <p id="error" class="text-red-500 text-sm hidden mt-3 text-center">Invalid ID</p>
    </div>

    <div id="formView" class="hidden">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-gray-800 font-bold text-xl">Submit Feedback</h3>
        <button onclick="logout()" class="text-indigo-600 font-medium text-sm hover:underline">Logout</button>
      </div>
      <label class="block text-gray-500 text-xs font-semibold mb-1 uppercase tracking-wide">Department</label>
      <select id="department" class="input mb-4 text-gray-700">
        <option>Consulting</option>
        <option>Support</option>
        <option>Development</option>
        <option>HR & Finance</option>
      </select>

      <label class="block text-gray-500 text-xs font-semibold mb-1 uppercase tracking-wide">Category</label>
      <select id="category" class="input mb-4 text-gray-700">
        <option>Work Place Environment</option>
        <option>Career Growth</option>
        <option>Rewards & Recognition</option>
        <option>Company Policies</option>
        <option>Benefits</option>
        <option>Others</option>
      </select>

      <label class="block text-gray-500 text-xs font-semibold mb-1 uppercase tracking-wide">Your Feedback</label>
      <textarea id="message" class="input mb-5 min-h-[120px] resize-none"
        placeholder="Type your honest feedback here..."></textarea>
      <button id="submitBtn" onclick="submit()" class="btn w-full">Submit Feedback</button>
      <p id="msg" class="text-center mt-3 text-sm font-medium text-red-500"></p>
    </div>

    <div id="successView" class="hidden text-center py-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-green-100 mb-6">
        <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h3 class="text-2xl font-bold text-gray-800 mb-2">Thank You!</h3>
      <p class="text-gray-500 mb-8 mx-auto max-w-xs">Your feedback has been submitted successfully and sent to the HR
        Team.</p>
      <button onclick="closeWindow()" class="btn w-full bg-gray-800 hover:bg-gray-900">Close Window</button>
    </div>

  </div>

  <script src="js/main.js"></script>
</body>

</html>
